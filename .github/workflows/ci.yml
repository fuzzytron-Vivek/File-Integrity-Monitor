name: FIM CI

on:
  push: 
    branches: [master] 
  pull_request: 
    branches: [master] 


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name : Install Dependencies
        run : | 
          sudo apt-get update 
          sudo apt-get install -y libssl-dev nlohmann-json3-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build
      
      



