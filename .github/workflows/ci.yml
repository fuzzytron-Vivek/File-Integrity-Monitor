name: FIM CI

on:
  push: 
    branches: [master] 
  pull_request: 
    branches: [master] 


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build


